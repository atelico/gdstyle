name: Performance

# Fails a PR whose gdstyle run costs noticeably more than the base branch's.
# Both binaries are built and measured on the same runner, so runner speed
# cancels out. See scripts/perf-compare.sh for what is measured.
on:
  pull_request:
    # labeled/unlabeled so adding perf-regression-ok re-runs the check. Any
    # other label re-runs it too: skipping those runs would report a pass
    # over an earlier failure on the same commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/perf-compare.sh"
      - ".github/workflows/perf.yml"
  # Builds on main fill the cargo cache. PR runs can only read caches that
  # main wrote, so without this every PR builds both binaries from scratch.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/perf-compare.sh"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Real Godot 4 GDScript (about 460 files), pinned so counts stay comparable.
  CORPUS_REPOSITORY: godotengine/godot-demo-projects
  CORPUS_REF: b761b4cd5718a7118f2c95eb55f181d0a5f004f1

jobs:
  compare:
    name: instruction count vs base
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@v5
        with:
          path: candidate
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2

      - name: Find the base commit
        id: base
        run: |
          # The first parent of the merge commit is exactly the code the PR is
          # merged into. On main, both sides are the pushed commit.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "sha=$(git -C candidate rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Check out the corpus
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CORPUS_REPOSITORY }}
          ref: ${{ env.CORPUS_REF }}
          path: corpus
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> target
            base -> target

      - name: Install valgrind and hyperfine
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y valgrind hyperfine

      - name: Build the base
        run: |
          cargo build --release --bin gdstyle --manifest-path base/Cargo.toml || {
            echo "::error::The base commit ${{ steps.base.outputs.sha }} did not build, so there is nothing to compare against."
            exit 1
          }

      - name: Build the PR
        run: cargo build --release --bin gdstyle --manifest-path candidate/Cargo.toml

      - name: Compare
        if: github.event_name == 'pull_request'
        env:
          PERF_ALLOW_REGRESSION: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-ok') && '1' || '0' }}
        run: |
          candidate/scripts/perf-compare.sh \
            base/target/release/gdstyle \
            candidate/target/release/gdstyle \
            corpus
